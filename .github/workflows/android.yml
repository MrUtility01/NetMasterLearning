name: Build Installable APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Verify UI entrypoint
        run: |
          test -f app/src/main/java/com/example/netmaster/ui/NetMasterApp.kt
          grep -q "fun NetMasterApp" app/src/main/java/com/example/netmaster/ui/NetMasterApp.kt
          echo "NetMasterApp OK"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Assemble Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Package APK
        run: |
          mkdir -p dist
          SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "SRC=$SRC"
          test -n "$SRC" && test -s "$SRC"
          cp "$SRC" dist/NetMaster-Learning.apk
          ls -lh dist/NetMaster-Learning.apk
          unzip -t dist/NetMaster-Learning.apk | tail -3

      - uses: actions/upload-artifact@v4
        with:
          name: NetMaster-Learning-APK
          path: dist/NetMaster-Learning.apk
          if-no-files-found: error
          retention-days: 30

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v11.0.${{ github.run_number }}
          name: NetMaster Learning — Build ${{ github.run_number }}
          body: |
            دانلود **NetMaster-Learning.apk**
            اگر نسخه قبلی نصب است اول حذف کنید.
            Package: com.example.netmaster
          files: dist/NetMaster-Learning.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
