name: NetMaster Learning 5.1 Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate JSON assets
        run: |
          python - <<'PY'
          import json, pathlib
          files=list(pathlib.Path('app/src/main/assets').rglob('*.json'))
          for p in files:
              json.loads(p.read_text(encoding='utf-8'))
              print('OK',p)
          print('validated',len(files),'JSON files')
          PY
      - name: Validate Gradle wrapper files
        run: test -x gradlew && test -s gradle/wrapper/gradle-wrapper.jar && test -s gradle/wrapper/gradle-wrapper.properties

  unit-and-debug:
    runs-on: ubuntu-latest
    needs: validate-content
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle test --no-daemon
      - name: Debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: netmaster-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: unit-and-debug
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - run: ./gradlew assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: netmaster-release-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/test-results/**
          if-no-files-found: error

  wrapper-smoke:
    runs-on: ubuntu-latest
    needs: validate-content
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Wrapper smoke test
        run: ./gradlew --version
